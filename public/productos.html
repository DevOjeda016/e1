<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos · Panadería La Espiga</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#b45309" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/productos.js"></script>
  </head>
  <body>
    <header class="cabecera">
      <a class="logo" href="/">🥖 La Espiga</a>
      <nav class="menu">
        <a href="/">Inicio</a>
        <a href="/productos.html" data-auth="in" hidden>Productos</a>
        <span id="saludo" data-auth="in" hidden></span>
        <button id="salir" type="button" data-auth="in" hidden>Salir</button>
        <a href="/login.html" data-auth="out" hidden>Entrar</a>
        <a href="/registro.html" data-auth="out" hidden>Registro</a>
      </nav>
    </header>

    <main>
      <section class="formulario">
        <h1 id="titulo-form">Nuevo producto</h1>
        <form id="form">
          <label>
            Nombre
            <input name="nombre" type="text" placeholder="Ej. Concha de vainilla" required />
          </label>
          <label>
            Precio (MXN)
            <input name="precio" type="number" min="0" step="0.01" required />
          </label>
          <label>
            Piezas disponibles
            <input name="stock" type="number" min="0" step="1" required />
          </label>
          <div class="acciones">
            <button class="boton" type="submit">Guardar</button>
            <button id="cancelar" class="boton secundario" type="button" hidden>Cancelar</button>
          </div>
        </form>
        <p id="mensaje" class="mensaje" role="alert"></p>
      </section>

      <section class="listado">
        <h2>Productos de la panadería</h2>
        <div class="tabla-scroll">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Piezas</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla"></tbody>
          </table>
        </div>
        <p id="vacio" class="vacio" hidden>Aún no hay productos. Agrega el primero arriba.</p>
      </section>
    </main>

    <footer class="pie">
      <p>Panadería La Espiga · Proyecto de práctica</p>
    </footer>
  </body>
</html>
